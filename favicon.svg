<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f4f0"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" stroke="#e0dfd9" stroke-width="2"/>
  
  <!-- H letter - dark -->
  <text x="42" y="125" font-family="Inter, Arial, sans-serif" font-size="85" font-weight="800" fill="#0f0f0f">H</text>
  
  <!-- . dot - blue -->
  <circle cx="120" cy="118" r="10" fill="#1a1aff"/>
  
  <!-- Hajjar text below -->
  <text x="100" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f0f0f" letter-spacing="3">HAJJAR</text>
  
  <!-- thin line -->
  <line x1="50" y1="165" x2="150" y2="165" stroke="#1a1aff" stroke-width="1.5"/>
  
  <!-- subtitle -->
  <text x="100" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#888" letter-spacing="2">FULL STACK DEV</text>
</svg>
